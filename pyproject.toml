[project]
name = "trading-system"
version = "0.1.0"
description = "Research-first quantitative trading platform for Indian markets"
authors = [
    { name = "Jack Sparrow", email = "moslem.ali.sheikh@hotmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "requests>=2.32",
    "dhanhq==2.2.0",
    "vollib==1.0.11",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
